[project]
name = "flograph"
version = "0.1.13"
description = "Visual node-based Python programming environment (flow-based dataflow, Blueprint-style canvas)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "redthista" }]
keywords = [
    "dataflow", "visual-programming", "node-editor", "etl", "pandas",
    "gui", "pyside6", "qt", "low-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.0",
    "jedi>=0.19",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/redthista/flograph"
Repository = "https://github.com/redthista/flograph"
Issues = "https://github.com/redthista/flograph/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-xdist>=3.6"]
excel = ["openpyxl", "python-calamine"]
matplotlib = ["matplotlib>=3.8"]
parquet = ["pyarrow", "fastparquet"]
polars = ["polars>=1.0", "fastexcel"]
plotly = ["plotly"]
geo = ["geopandas", "folium"]
ai = ["requests", "httpx>=0.27"]
sql = ["sqlalchemy>=2.0"]
duckdb = ["duckdb>=1.0"]
http = ["httpx>=0.27"]
dataiku = ["dataiku-api-client>=12.0"]
fuzzy = ["rapidfuzz>=3.0"]
scrape = ["lxml", "beautifulsoup4", "html5lib"]

[project.scripts]
flograph = "flograph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flograph"]

# Allowlist, not a denylist: hatchling otherwise sweeps the whole repo into
# the sdist, and anything a tool drops here later (editor caches, agent
# tooling, a stray perf-test project) would ship to PyPI permanently.
[tool.hatch.build.targets.sdist]
include = [
    "/src/flograph",
    "/tests",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel runs: `pytest -n12 --dist loadfile` takes the ~6-min serial suite to
# ~1 min. loadfile (not the default per-test split) is required — many modules
# share a module-scoped Qt fixture and isolate QSettings per file, so a whole
# module must stay on one worker. Left off by default: a focused single-file
# run pays ~0.7s per worker to spawn, and the inner dev loop wants that back.
