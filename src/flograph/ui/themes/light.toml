# flograph's light theme.
#
# The idea: neutral greys, no blue or purple cast. White is where you work
# (lists, inputs, nodes, the editor, each dock's card); a light grey is the
# frame around it (the window, dock titles, tabs, the status bar); the
# title bar and toolbar are a dark grey band across the top; the canvas
# sits a step darker than the window so a white node is the brightest
# thing on it. There is one accent colour — blue — for selection, focus
# and links. Text is near-black on white (~16:1); secondary text stays
# above 5:1.

[meta]
label = "Light"
kind = "light"
based_on = "dark"

[ui]
window = "#f3f3f3"
window_text = "#1f1f1f"
base = "#ffffff"
alt_base = "#f7f7f7"
text = "#1f1f1f"
button = "#ffffff"
button_text = "#1f1f1f"
bright_text = "#cf222e"
light = "#ffffff"
midlight = "#f5f5f5"
dark = "#c6c6c6"
mid = "#5f5f5f"
shadow = "#ababab"
placeholder = "#8a8a8a"
tooltip_bg = "#2b2b2b"
tooltip_text = "#ffffff"
tooltip_border = "#2b2b2b"
highlight = "#2563eb"
highlighted_text = "#ffffff"
link = "#0969da"
link_visited = "#8250df"
accent = "#2563eb"
disabled_text = "#a3a3a3"
disabled_base = "#f2f2f2"
disabled_button = "#f2f2f2"
dock_title = "#f3f3f3"
tab = "#e8e8e8"
tab_selected = "#ffffff"
statusbar = "#d6d6d6"
line = "#d4d4d4"
accent_line = "#2563eb"
menu = "#ffffff"
menu_border = "#cfcfcf"
input_border = "#a8a8a8"
input_focus = "#2563eb"
scrollbar = "#c2c2c2"
scrollbar_hover = "#a3a3a3"
panel = "#ffffff"
panel_border = "#c9c9c9"
panel_title = "#d3d3d3"
divider = "#9a9a9a"

