# flograph's light theme.
#
# The idea: neutral greys, no blue or purple cast. White is where you work
# (lists, inputs, nodes, the editor, each dock's card); a light grey is the
# frame around it (the window, dock titles, tabs, the status bar); the
# title bar and toolbar are a dark grey band across the top; the canvas
# sits a step darker than the window so a white node is the brightest
# thing on it. There is one accent colour — blue — for selection, focus
# and links. Text is near-black on white (~16:1); secondary text stays
# above 5:1.

[meta]
label = "Light"
kind = "light"
based_on = "dark"

[ui]
window = "#f4f6fa"
window_text = "#1d2939"
base = "#ffffff"
alt_base = "#f7f9fc"
text = "#1d2939"
button = "#ffffff"
button_text = "#1d2939"
bright_text = "#cf222e"
light = "#ffffff"
midlight = "#eef2f7"
dark = "#d8e0ea"
mid = "#5b6b7d"
shadow = "#b7c2d0"
placeholder = "#7d8a9b"
tooltip_bg = "#1d2939"
tooltip_text = "#ffffff"
tooltip_border = "#1d2939"
highlight = "#2869e8"
highlighted_text = "#ffffff"
link = "#2869e8"
link_visited = "#8250df"
accent = "#2869e8"
disabled_text = "#98a4b3"
disabled_base = "#f1f4f8"
disabled_button = "#f1f4f8"
