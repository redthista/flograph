# Dark Slate: the cool, navy dark of the 2026 UI redesign
# (docs/design/ui-ux-redesign-2026/). Inherits every key from `dark` and
# changes the surfaces, text, accent and wires to the redesign's palette.
# `dark` itself stays the reference, unchanged.

